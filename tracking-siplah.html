<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking Pesanan SIPLah</title>
<style>
  :root{
    --ink:#14202b;
    --ink-soft:#4b5c6b;
    --line:#dfe5ea;
    --line-soft:#eef1f4;
    --bg:#f6f8f9;
    --panel:#ffffff;
    --navy:#1f3a5f;
    --navy-deep:#16283f;
    --teal:#2f7a6f;
    --amber:#b5760f;
    --amber-bg:#fdf3e2;
    --green-bg:#e7f3ee;
    --green:#1e6b52;
    --red:#a13b3b;
    --red-bg:#fbecec;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    line-height:1.45;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--navy-deep);
    color:#eef2f6;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .topbar .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand .kicker{
    font-size:11px;
    letter-spacing:.02em;
    color:#9db3c8;
    font-weight:600;
  }
  .brand h1{
    margin:0;
    font-size:19px;
    font-weight:650;
    letter-spacing:-0.01em;
  }
  .topstats{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
  }
  .topstat{
    text-align:right;
  }
  .topstat .num{
    font-size:20px;
    font-weight:700;
    line-height:1.1;
  }
  .topstat .lbl{
    font-size:11px;
    color:#9db3c8;
    margin-top:2px;
  }

  /* ---------- Layout ---------- */
  .wrap{
    max-width:1400px;
    margin:0 auto;
    padding:20px 24px 60px;
  }

  /* ---------- Summary cards ---------- */
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
    margin-bottom:18px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .card .val{
    font-size:22px;
    font-weight:700;
    color:var(--navy-deep);
  }
  .card .cap{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .card.done .val{color:var(--green);}
  .card.pending .val{color:var(--amber);}

  /* ---------- Controls ---------- */
  .controls{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .controls input[type=text]{
    flex:1 1 240px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    background:#fbfcfd;
    color:var(--ink);
  }
  .controls input[type=text]:focus{
    outline:2px solid #2f7a6f55;
    border-color:var(--teal);
  }
  .controls select{
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;
    background:#fbfcfd;
    color:var(--ink);
  }
  .controls .seg{
    display:flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  .controls .seg button{
    border:none;
    background:#fbfcfd;
    padding:9px 12px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-soft);
    border-right:1px solid var(--line);
  }
  .controls .seg button:last-child{border-right:none;}
  .controls .seg button.active{
    background:var(--navy);
    color:#fff;
    font-weight:600;
  }
  .controls .result-count{
    font-size:12px;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  /* ---------- Table ---------- */
  .tablewrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:auto;
    max-height:70vh;
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width:1180px;
  }
  thead th{
    position:sticky;
    top:0;
    background:#f1f4f6;
    border-bottom:1px solid var(--line);
    text-align:left;
    padding:10px 12px;
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:650;
    white-space:nowrap;
    z-index:2;
  }
  tbody td{
    padding:9px 12px;
    border-bottom:1px solid var(--line-soft);
    vertical-align:top;
    white-space:nowrap;
  }
  tbody td.wrap-cell{white-space:normal;max-width:220px;}
  tbody tr:hover{background:#fafbfc;}
  .mono{font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-soft);}

  .pill{
    display:inline-block;
    padding:2px 9px;
    border-radius:99px;
    font-size:11.5px;
    font-weight:600;
    white-space:nowrap;
  }
  .pill.reg{
    background:#e7edf3;
    color:var(--navy);
  }
  .pill.blank{background:var(--red-bg);color:var(--red);}
  .pill.konfirmasi{background:var(--green-bg);color:var(--green);}

  /* ---------- Manual mark toggle ---------- */
  .mark-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    background:#fbfcfd;
    border-radius:8px;
    padding:6px 10px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
    transition:background .12s, color .12s, border-color .12s;
  }
  .mark-btn .dot{
    width:8px;height:8px;border-radius:50%;
    background:#c6ccd1;
    flex:none;
  }
  .mark-btn.done{
    background:var(--green-bg);
    border-color:#bfe0d2;
    color:var(--green);
  }
  .mark-btn.done .dot{background:var(--green);}
  .mark-btn:hover{filter:brightness(0.98);}

  /* ---------- Empty state ---------- */
  .empty{
    padding:50px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:4px;}

  footer{
    text-align:center;
    color:#9aa8b3;
    font-size:11.5px;
    margin-top:22px;
  }

  @media (max-width:720px){
    .topbar{padding:14px 16px;}
    .wrap{padding:14px 12px 40px;}
    .topstats{gap:14px;}
    thead th, tbody td{padding:8px 9px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="kicker">SIPLah &middot; Gramedia</span>
    <h1>Tracking Pesanan Sekolah</h1>
  </div>
  <div class="topstats" id="topstats"></div>
</div>

<div class="wrap">

  <div class="cards" id="cards"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Cari nama sekolah, toko, NPSN, atau PIC…">
    <select id="filterRegional"><option value="">Semua Regional</option></select>
    <select id="filterArea"><option value="">Semua Area</option></select>
    <select id="filterEntity"><option value="">Semua Entity</option></select>
    <div class="seg" id="markSeg">
      <button data-val="" class="active">Semua</button>
      <button data-val="done">Sudah Diisi</button>
      <button data-val="pending">Belum Diisi</button>
    </div>
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Regional</th>
          <th>Toko</th>
          <th>Nama Sekolah</th>
          <th>NPSN</th>
          <th>PIC Store</th>
          <th>Siswa</th>
          <th>Estimasi Value</th>
          <th>Status SIPLah</th>
          <th>PIC Sales</th>
          <th>Tanda Manual</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">
      <div class="big">Tidak ada data yang cocok</div>
      <div>Coba ubah kata kunci pencarian atau filter.</div>
    </div>
  </div>

  <footer>Tanda manual disimpan otomatis di perangkat ini &middot; total data: <span id="footTotal"></span> sekolah</footer>
</div>

<script>
/* ============ App logic ============ */
const state = {
  q: "",
  regional: "",
  area: "",
  entity: "",
  mark: "" // "", "done", "pending"
};
const marks = {}; // uniq -> true/false, loaded from storage

function fmtIDR(v){
  if(v === "" || v === null || v === undefined) return "-";
  const n = typeof v === "number" ? v : parseInt(String(v).replace(/[^\d-]/g,""),10);
  if(isNaN(n)) return v;
  return "Rp " + n.toLocaleString("id-ID");
}

function uniqueSorted(arr){
  return Array.from(new Set(arr.filter(v=>v!=="" && v!=null))).sort((a,b)=>String(a).localeCompare(String(b)));
}

function populateFilters(){
  const regs = uniqueSorted(DATA.map(d=>d.regional));
  const areas = uniqueSorted(DATA.map(d=>d.area));
  const ents = uniqueSorted(DATA.map(d=>d.entity));
  const selReg = document.getElementById('filterRegional');
  const selArea = document.getElementById('filterArea');
  const selEnt = document.getElementById('filterEntity');
  regs.forEach(r=>{
    const o=document.createElement('option'); o.value=r; o.textContent="Regional "+r; selReg.appendChild(o);
  });
  areas.forEach(a=>{
    const o=document.createElement('option'); o.value=a; o.textContent=a; selArea.appendChild(o);
  });
  ents.forEach(e=>{
    const o=document.createElement('option'); o.value=e; o.textContent=e; selEnt.appendChild(o);
  });
}

function matches(d){
  if(state.regional && d.regional !== state.regional) return false;
  if(state.area && d.area !== state.area) return false;
  if(state.entity && d.entity !== state.entity) return false;
  const isDone = !!marks[d.uniq];
  if(state.mark === 'done' && !isDone) return false;
  if(state.mark === 'pending' && isDone) return false;
  if(state.q){
    const q = state.q.toLowerCase();
    const hay = [d.namaSekolah,d.storeName,d.namaStore,d.npsn,d.picStore,d.picSales,d.storeCode]
      .map(x=>String(x||"").toLowerCase()).join(" | ");
    if(!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const filtered = DATA.filter(matches);
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  document.getElementById('resultCount').textContent = filtered.length.toLocaleString('id-ID') + " dari " + DATA.length.toLocaleString('id-ID') + " data";

  if(filtered.length === 0){
    tbody.innerHTML = "";
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
    const rowsHtml = filtered.slice(0, 500).map(d=>{
      const isDone = !!marks[d.uniq];
      const statusClass = d.statusSiplah === 'Konfirmasi' ? 'konfirmasi' : 'blank';
      return `<tr>
        <td class="mono">${d.no}</td>
        <td><span class="pill reg">Reg ${escapeHtml(d.regional)}</span></td>
        <td class="wrap-cell">${escapeHtml(d.storeName || d.namaStore)}</td>
        <td class="wrap-cell">${escapeHtml(d.namaSekolah)}</td>
        <td class="mono muted">${escapeHtml(d.npsn)}</td>
        <td>${escapeHtml(d.picStore)}</td>
        <td class="mono">${escapeHtml(d.jumlahSiswa)}</td>
        <td class="mono">${fmtIDR(d.estimasiValue)}</td>
        <td><span class="pill ${statusClass}">${escapeHtml(d.statusSiplah)}</span></td>
        <td>${escapeHtml(d.picSales)}</td>
        <td>
          <button class="mark-btn ${isDone?'done':''}" data-uniq="${d.uniq}">
            <span class="dot"></span>${isDone ? 'Sudah Diisi' : 'Belum Diisi'}
          </button>
        </td>
      </tr>`;
    }).join("");
    tbody.innerHTML = rowsHtml;
    if(filtered.length > 500){
      tbody.innerHTML += `<tr><td colspan="11" style="text-align:center;color:var(--ink-soft);padding:14px;">Menampilkan 500 dari ${filtered.length} hasil — persempit pencarian untuk melihat lebih spesifik.</td></tr>`;
    }
  }

  renderCards(filtered);
  renderTopstats();
}

function escapeHtml(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderCards(filtered){
  const total = filtered.length;
  const done = filtered.filter(d=>!!marks[d.uniq]).length;
  const pending = total - done;
  const totalValue = filtered.reduce((acc,d)=>{
    const n = parseInt(String(d.estimasiValue||"0").replace(/[^\d-]/g,""),10);
    return acc + (isNaN(n)?0:n);
  },0);
  document.getElementById('cards').innerHTML = `
    <div class="card">
      <div class="val">${total.toLocaleString('id-ID')}</div>
      <div class="cap">Sekolah (sesuai filter)</div>
    </div>
    <div class="card done">
      <div class="val">${done.toLocaleString('id-ID')}</div>
      <div class="cap">Sudah Diisi</div>
    </div>
    <div class="card pending">
      <div class="val">${pending.toLocaleString('id-ID')}</div>
      <div class="cap">Belum Diisi</div>
    </div>
  `;
}

function renderTopstats(){
  const total = DATA.length;
  const doneAll = DATA.filter(d=>!!marks[d.uniq]).length;
  document.getElementById('topstats').innerHTML = `
    <div class="topstat"><div class="num">${total.toLocaleString('id-ID')}</div><div class="lbl">Total Sekolah</div></div>
    <div class="topstat"><div class="num">${doneAll.toLocaleString('id-ID')}</div><div class="lbl">Sudah Diisi (semua)</div></div>
  `;
}

async function toggleMark(uniq){
  const key = "mark:" + uniq;
  const newVal = !marks[uniq];
  marks[uniq] = newVal;
  render();
  try{
    if(newVal){
      await window.storage.set(key, "1", false);
    } else {
      await window.storage.delete(key, false);
    }
  }catch(e){
    console.error("Gagal menyimpan tanda:", e);
  }
}

async function loadMarks(){
  try{
    const listRes = await window.storage.list("mark:", false);
    if(listRes && listRes.keys){
      for(const k of listRes.keys){
        const uniq = k.slice("mark:".length);
        marks[uniq] = true;
      }
    }
  }catch(e){
    console.log("Belum ada tanda tersimpan atau storage tidak tersedia.", e);
  }
}

// events
document.getElementById('search').addEventListener('input', e=>{
  state.q = e.target.value.trim();
  render();
});
document.getElementById('filterRegional').addEventListener('change', e=>{
  state.regional = e.target.value; render();
});
document.getElementById('filterArea').addEventListener('change', e=>{
  state.area = e.target.value; render();
});
document.getElementById('filterEntity').addEventListener('change', e=>{
  state.entity = e.target.value; render();
});
document.getElementById('markSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  [...document.getElementById('markSeg').children].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.mark = btn.dataset.val;
  render();
});
document.getElementById('tbody').addEventListener('click', e=>{
  const btn = e.target.closest('.mark-btn');
  if(!btn) return;
  toggleMark(btn.dataset.uniq);
});

(async function init(){
  document.getElementById('footTotal').textContent = DATA.length.toLocaleString('id-ID');
  populateFilters();
  await loadMarks();
  render();
})();
</script>
</body>
</html>
